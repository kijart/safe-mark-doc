# nginx server for the Safe Mark Doc container image.
# The app is fully static: nginx only serves files, it never receives documents.

# nginx's default mime.types lacks these, and browsers reject ES modules served
# with the wrong type.
types {
  text/javascript              mjs;
  application/manifest+json    webmanifest;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Relative redirects keep working when the container port is remapped.
  absolute_redirect off;
  charset utf-8;
  charset_types text/css text/javascript application/manifest+json image/svg+xml;

  gzip on;
  gzip_types text/css text/javascript application/manifest+json image/svg+xml;

  # The CSP blocks any network access except this origin, so the "nothing is
  # uploaded" promise is enforced by the browser too. The hash allows the inline
  # theme script in index.html; recompute it if that script changes:
  #   python3 -c "import re,hashlib,base64;s=re.search(r'<script>(.*?)</script>',open('src/index.html').read(),re.S).group(1);print(base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())"
  set $csp "default-src 'self'; script-src 'self' 'sha256-SOkTy9/9OgmfgG5jYBqHfkcarbmCTaWzUJ3GbNUOKh4='; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The app shell, service worker and manifest must always be revalidated so
  # clients notice a new VERSION in sw.js.
  # add_header is not inherited by locations that declare their own, so each
  # location includes the full set of security headers.
  location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)?$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;

    # Android share target: the service worker normally intercepts this POST.
    # If it is not active yet, send the user to the app instead of a 405.
    if ($request_method = POST) {
      return 303 /;
    }
    try_files $uri /index.html;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
}
